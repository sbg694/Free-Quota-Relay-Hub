# FQRH v4 · docker compose 部署（可选）
# 用法（在仓库根目录执行）：
#   cp config.example.json config.json     # 改 providers / clientKeys
#   cp deploy/systemd/fqrh.env.example fqrh.env
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  fqrh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fqrh-v4:local
    container_name: fqrh
    restart: unless-stopped
    ports:
      - "8790:8790"
    volumes:
      - ../config.json:/etc/fqrh/config.json:ro
      - ../data:/data/data
    env_file:
      - ../fqrh.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
